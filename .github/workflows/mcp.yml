name: mcp
on:
  push:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/mcp.yml"]
  pull_request:
    paths: ["mcp/**", ".github/workflows/mcp.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: mcp
