name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ai-client:
    name: Offline AI client contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s backend/unit_tests -v

  frontend:
    name: Frontend lint, types and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck

  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU inference runtime
        run: pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -c constraints-py312.txt -e ".[dev]"

      - name: black
        run: black --check --line-length 100 .

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hireos
          POSTGRES_PASSWORD: hireos_secret
          POSTGRES_DB: hireos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://hireos:hireos_secret@localhost:5432/hireos_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      APP_ENV: test
      AI_MOCK_MODE: "true"
      SMTP_HOST: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU inference runtime
        run: pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -c constraints-py312.txt -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Install PDF and OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng poppler-utils libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: pytest
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80

