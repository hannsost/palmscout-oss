{{- range $component, $port := dict "api" 8000 "web" 3000 "postgres" 5432 "redis" 6379 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "palmscout.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: tcp
      port: {{ $port }}
      targetPort: {{ $port }}
{{- end }}
