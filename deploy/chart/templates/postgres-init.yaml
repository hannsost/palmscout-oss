apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
data:
  01-palmscout.sh: |
    #!/bin/sh
    set -eu
    set +x
    fail() { echo 'PalmScout database initialization failed; credentials suppressed.' >&2; exit 1; }
    case "${PALMSCOUT_DB_PASSWORD:-}" in ''|*[!A-Za-z0-9_-]*) fail;; esac
    [ "${#PALMSCOUT_DB_PASSWORD}" -ge 32 ] || fail
    # Fresh database only. Do not log SQL containing the validated password.
    export PGOPTIONS='-c log_statement=none -c log_min_error_statement=panic'
    psql -X --set ON_ERROR_STOP=1 --username postgres --dbname palmscout >/dev/null 2>&1 <<SQL || fail
    CREATE ROLE palmscout LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '${PALMSCOUT_DB_PASSWORD}';
    ALTER DATABASE palmscout OWNER TO palmscout;
    REVOKE ALL ON DATABASE palmscout FROM PUBLIC;
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    ALTER SCHEMA public OWNER TO palmscout;
    CREATE EXTENSION IF NOT EXISTS vector;
    SQL
