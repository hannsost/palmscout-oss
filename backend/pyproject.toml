[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "hireos-backend"
version = "0.1.0"
description = "Palmscout Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Auth & Security
    "PyJWT[crypto]>=2.10.1,<3",
    "cryptography>=50.0.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.2,<4.0",   # passlib 1.7.4 incompatible with bcrypt 4+
    "python-multipart>=0.0.9",

    # Config
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Redis
    "redis>=5.0.0",

    # Utils
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0,<1",

    # Storage and billing integrations used by the application
    "boto3>=1.35.0,<2",
    "stripe>=11.0.0,<20",

    # Export (Sprint 0.7)
    "weasyprint>=62.0",

    # Monitoring + Rate Limiting (Sprint 0.8)
    "sentry-sdk[fastapi]>=2.0.0",
    "slowapi>=0.1.9",

    # Real-time + Notifications (Sprint 1.1)
    "apscheduler>=3.10.4",
    "aiosmtplib>=3.0.0",

    # AI / CV Parsing (Sprint 0.3)
    "feedparser>=6.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
# Provision the local model separately; the core API never downloads a model.
embeddings = ["sentence-transformers>=3.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.7.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-dateutil",
    "types-passlib",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency and parameter declarations are immutable metadata.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env_files = [".env.test"]
env_files_skip_if_set = true
# Fallback env vars so tests work without a .env.test file
env = [
    "D:SECRET_KEY=test-secret-key-for-testing-only",
    "D:DATABASE_URL=postgresql+asyncpg://hireos:hireos_secret@db:5432/hireos_test",
    "D:REDIS_URL=redis://:redis_secret@redis:6379/1",
    "APP_ENV=test",
    "AI_MOCK_MODE=true",
    "SMTP_HOST=",
]

[tool.coverage.run]
# SQLAlchemy's async adapter switches greenlets. Without this, coverage loses
# resumed request execution after database awaits and underreports tested code.
concurrency = ["greenlet", "thread"]
source = ["app"]
