# Alembic configuration file
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for created_at in migration files
timezone = UTC

# SQLAlchemy URL – overridden by env.py reading DATABASE_URL from environment
sqlalchemy.url = postgresql+asyncpg://hireos:hireos_secret@localhost:5432/hireos

[post_write_hooks]
# Optionally run black/ruff on generated migration files
# hooks = black, ruff
# black.type = console_scripts
# black.entrypoint = black
# ruff.type = console_scripts
# ruff.entrypoint = ruff

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
